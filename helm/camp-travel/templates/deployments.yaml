# 1. Experience UI & Review Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.experienceUI.name }}
  labels: { app: {{ .Values.experienceUI.name }} }
spec:
  replicas: {{ .Values.experienceUI.replicaCount }}
  selector: { matchLabels: { app: {{ .Values.experienceUI.name }} } }
  template:
    metadata:
      labels: { app: {{ .Values.experienceUI.name }} }
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: "{{ .Values.experienceUI.name }}"
        consul.hashicorp.com/connect-service-port: "{{ .Values.experienceUI.port }}"
        consul.hashicorp.com/transparent-proxy-exclude-inbound-ports: "3000"
        consul.hashicorp.com/connect-service-upstreams: "{{ .Values.apiGw.name }}:10000, {{ .Values.bookingAgent.name }}:8086, {{ .Values.indigoAnalytics.name }}:8089, {{ .Values.otelCollector.name }}:4318"
    spec:
      serviceAccountName: {{ .Values.experienceUI.name }}
      containers:
        - name: experience-ui
          image: {{ .Values.images.python }}
          command:
            - "sh"
            - "-c"
            - "export PYTHONPATH=/tmp/pkg:/app && pip install --no-cache-dir --target /tmp/pkg fastapi uvicorn[standard] httpx pydantic jinja2 && python3 -m uvicorn frontend_main:app --host 0.0.0.0 --port 3000"
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: API_GATEWAY_URL
              value: "http://{{ .Values.apiGw.name }}:10000"
            - name: BOOKING_AGENT_URL
              value: "http://{{ .Values.bookingAgent.name }}:8086"
            - name: INDIGO_ANALYTICS_URL
              value: "http://{{ .Values.indigoAnalytics.name }}:8089"
            - name: OTEL_COLLECTOR_URL
              value: "http://{{ .Values.otelCollector.name }}:4318"
          volumeMounts:
            - name: python-code
              mountPath: /app
            - name: html-ui
              mountPath: /app/static
          resources:
            {{- toYaml .Values.experienceUI.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: python-code
          configMap: { name: camp-python-sources }
        - name: html-ui
          configMap: { name: camp-ui-html }

---
# 2. Ingress API Gateway (Envoy)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.apiGw.name }}
  labels: { app: {{ .Values.apiGw.name }} }
spec:
  replicas: {{ .Values.apiGw.replicaCount }}
  selector: { matchLabels: { app: {{ .Values.apiGw.name }} } }
  template:
    metadata:
      labels: { app: {{ .Values.apiGw.name }} }
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: "{{ .Values.apiGw.name }}"
        consul.hashicorp.com/connect-service-port: "{{ .Values.apiGw.port }}"
        consul.hashicorp.com/transparent-proxy-exclude-inbound-ports: "10000"
    spec:
      serviceAccountName: {{ .Values.apiGw.name }}
      containers:
        - name: api-gw
          image: {{ .Values.images.envoy }}
          command: ["envoy"]
          args: ["-c", "/etc/envoy/api_gw.yaml", "--log-level", "info"]
          ports:
            - { name: gateway, containerPort: 10000 }
            - { name: admin, containerPort: 9900 }
          volumeMounts:
            - name: envoy-configs
              mountPath: /etc/envoy
          resources:
            {{- toYaml .Values.apiGw.resources | nindent 12 }}
      volumes:
        - name: envoy-configs
          configMap: { name: camp-gateway-configs }

