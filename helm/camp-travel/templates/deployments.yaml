      labels: { app: {{ .Values.indigoAnalytics.name }} }
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: "{{ .Values.indigoAnalytics.name }}"
        consul.hashicorp.com/connect-service-port: "{{ .Values.indigoAnalytics.port }}"
    spec:
      serviceAccountName: {{ .Values.indigoAnalytics.name }}
      containers:
        - name: indigo-analytics
          image: {{ .Values.images.python }}
          command:
            - "sh"
            - "-c"
            - "export PYTHONPATH=/tmp/pkg:/app && pip install --no-cache-dir --target /tmp/pkg fastapi uvicorn[standard] httpx pydantic && python3 -m uvicorn indigo_analytics_main:app --host 0.0.0.0 --port 8089"
          ports: [{ name: http, containerPort: 8089 }]
          volumeMounts:
            - name: python-code
              mountPath: /app
          resources:
            {{- toYaml .Values.indigoAnalytics.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: python-code
          configMap: { name: camp-python-sources }
