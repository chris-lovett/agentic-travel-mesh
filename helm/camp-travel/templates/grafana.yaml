{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        orgId: 1
        url: http://tempo:3200
        basicAuth: false
        isDefault: true
        version: 1
        editable: false
        apiVersion: 1
        uid: tempo-traces
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: 'prometheus'
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: 'loki'
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: '1h'
            spanEndTimeShift: '1h'
          spanBar:
            type: 'Tag'
            tag: 'http.path'

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.grafana.name }}
  labels: { app: {{ .Values.grafana.name }} }
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: {{ .Values.grafana.name }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.grafana.name }}
  labels: { app: {{ .Values.grafana.name }} }
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector: { matchLabels: { app: {{ .Values.grafana.name }} } }
  template:
    metadata:
      labels: { app: {{ .Values.grafana.name }} }
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
{{- end }}
