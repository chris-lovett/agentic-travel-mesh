apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.experienceUI.name }}
  labels: { app: {{ .Values.experienceUI.name }} }
spec:
  type: ClusterIP
  ports:
    - { port: {{ .Values.experienceUI.port }}, targetPort: http, name: http }
  selector: { app: {{ .Values.experienceUI.name }} }
---
