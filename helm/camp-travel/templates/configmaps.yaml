    from fastapi import FastAPI
    from pydantic import BaseModel
    import random

    app = FastAPI(title="Weather MCP Server")

    class WeatherQuery(BaseModel):
        destination: str
        days: int = 4

    WEATHER_DATABASE = {
        "san francisco": {"temp_c": 18, "condition": "Partly Cloudy / Coastal Fog", "precipitation_chance": 15, "packing": "Light layers, light jacket, walking shoes"},
        "new york": {"temp_c": 22, "condition": "Sunny", "precipitation_chance": 5, "packing": "Comfortable summer/fall attire"},
        "london": {"temp_c": 15, "condition": "Light Rain / Overcast", "precipitation_chance": 65, "packing": "Waterproof jacket, umbrella"},
        "tokyo": {"temp_c": 24, "condition": "Clear & Mild", "precipitation_chance": 10, "packing": "Breathable clothing, comfortable sneakers"},
    }

    @app.post("/mcp/weather/forecast")
    async def get_weather_forecast(query: WeatherQuery):
        city_key = query.destination.strip().lower()
        data = WEATHER_DATABASE.get(city_key, {"temp_c": 21, "condition": "Mild & Clear", "precipitation_chance": 20, "packing": "Standard seasonal attire"})
        forecast = [{"day": f"Day {d}", "high_c": data["temp_c"] + random.randint(1, 3), "condition": data["condition"]} for d in range(1, query.days + 1)]
        return {
            "mcp_tool": "weather_server",
            "destination": query.destination,
            "summary": f"{data['condition']}, averaging {data['temp_c']}°C ({int(data['temp_c'] * 9/5 + 32)}°F)",
            "packing_recommendation": data["packing"],
            "daily_forecast": forecast,
        }

    @app.get("/healthz")
    async def health():
        return {"status": "healthy", "service": "weather-mcp"}

