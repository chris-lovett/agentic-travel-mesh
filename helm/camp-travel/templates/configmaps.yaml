    from fastapi import FastAPI, Request, HTTPException, status
    from pydantic import BaseModel
    from typing import List, Optional
    import time, math

    app = FastAPI(title="CAMP Foundation Model Service", version="2.1.0")

    class ChatMessage(BaseModel):
        role: str
        content: str

    class ChatCompletionRequest(BaseModel):
        model: str
        messages: List[ChatMessage]

    def calc_tokens(text: str) -> int:
        if not text:
            return 0
        return max(len(text.split()), math.ceil(len(text) / 3.7))

    @app.post("/v1/chat/completions")
    @app.post("/openai/v1/chat/completions")
    async def chat_completions(req: ChatCompletionRequest, request: Request):
        auth = request.headers.get("authorization", "")
        if not auth.startswith("Bearer "):
            raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail="Missing Vault API key")

        user_prompt = "\n".join([m.content for m in req.messages if m.role == "user"])
        p_tokens = calc_tokens(user_prompt)

        dest = "the destination"
        for line in user_prompt.splitlines():
            if "destination:" in line.lower() or "to " in line.lower() or "route:" in line.lower():
                parts = line.split(":")[-1].strip()
                if parts:
                    dest = parts

        reply = f"[travel-igw AI Gateway] Completed multi-agent reasoning with '{req.model}'. Consolidated flight, hotel, and transport logistics for {dest}. Itinerary meets corporate travel compliance."
        c_tokens = calc_tokens(reply)
        total_tok = p_tokens + c_tokens
        call_cost = round(total_tok * 0.000005, 5)

        return {
            "id": f"chatcmpl-{int(time.time()*1000)}",
            "model": req.model,
            "choices": [{"index": 0, "message": {"role": "assistant", "content": reply}}],
            "usage": {"prompt_tokens": p_tokens, "completion_tokens": c_tokens, "total_tokens": total_tok},
            "gateway_metadata": {
                "authenticated_by_vault": True,
                "gateway_tier": request.headers.get("x-consul-mesh-tier", "travel-igw-2.1"),
                "estimated_cost_usd": call_cost,
            },
        }

    @app.post("/v1/messages")
    @app.post("/anthropic/v1/messages")
    async def anthropic_messages(request: Request):
        return {"id": f"msg-{int(time.time()*1000)}", "content": [{"type": "text", "text": "[Anthropic via travel-igw] Synthesized message response."}], "usage": {"input_tokens": 20, "output_tokens": 25}}

    @app.get("/healthz")
