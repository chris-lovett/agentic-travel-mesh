        return {"status": "healthy", "service": "llm-backend"}

  external_mcp_main.py: |
    from fastapi import FastAPI, Request, HTTPException, status
    from pydantic import BaseModel
    import uuid

    app = FastAPI(title="External Partner Travel MCP Server")

    class CarRentalRequest(BaseModel):
        destination: str
        vehicle_class: str = "Executive Sedan"
        rental_days: int = 4

    @app.post("/external/mcp/ground-transport")
    async def ground_transport(req: CarRentalRequest, request: Request):
        auth_header = request.headers.get("authorization", "")
        if not auth_header or not auth_header.startswith("Bearer "):
            raise HTTPException(status_code=status.HTTP_401_UNAUTHORIZED, detail="Missing Vault credential")

        return {
            "external_mcp": "amadeus-partner-gds",
            "status": "reserved",
            "rental_id": f"RENT-{uuid.uuid4().hex[:6].upper()}",
            "destination": req.destination,
            "vehicle": req.vehicle_class,
            "days": req.rental_days,
            "total_amount_usd": 85.0 * req.rental_days,
            "vault_egress_security": {"credential_injected_by": "consul-terminating-gateway", "authenticated": True},
        }

    @app.get("/healthz")
    async def health():
        return {"status": "healthy", "service": "external-mcp"}

  otel_collector_main.py: |
    from fastapi import FastAPI, Request
    import time

    app = FastAPI(title="CAMP OpenTelemetry Collector")
    traces_store = []

    @app.post("/v1/traces")
    async def ingest_trace(request: Request):
        data = await request.json()
        p_tok = data.get("prompt_tokens", int(data.get("tokens_used", 0) * 0.6))
        c_tok = data.get("completion_tokens", int(data.get("tokens_used", 0) * 0.4))
        tot_tok = p_tok + c_tok
        t_id = data.get("trace_id", f"trace-{int(time.time()*1000)}")
        record = {
            "ingest_timestamp": time.strftime("%Y-%m-%d %H:%M:%S"),
            "trace_id": t_id,
            "service": data.get("service", "travel-orchestrator"),
            "otel_gen_ai_attributes": {
                "gen_ai.system": "watsonx / consul-ai-gw",
                "gen_ai.request.model": data.get("model", "meta-llama/llama-3-70b-instruct"),
                "gen_ai.usage.prompt_tokens": p_tok,
                "gen_ai.usage.completion_tokens": c_tok,
                "gen_ai.usage.total_tokens": tot_tok,
                "gen_ai.usage.cost_usd": round(tot_tok * 0.000005, 5),
            },
            "tokens_used": tot_tok,
            "payload": data,
        }
        traces_store.append(record)

        # Forward standard OTLP span hierarchy into Tempo
        try:
            import httpx, uuid
            now_ns = int(time.time() * 1e9)
            raw_tid = str(data.get("trace_id", "")).replace("trace-camp-", "").replace("trace-", "")
            if len(raw_tid) < 32:
                raw_tid = (raw_tid + uuid.uuid4().hex)[:32]
            else:
                raw_tid = raw_tid[:32]

            parent_span_id = uuid.uuid4().hex[:16]
            agent_span_id = uuid.uuid4().hex[:16]
            llm_span_id = uuid.uuid4().hex[:16]

            otlp_spans = {
                "resourceSpans": [
                    {
                        "resource": {
                            "attributes": [
                                {"key": "service.name", "value": {"stringValue": "camp-agentic-mesh"}},
                                {"key": "gen_ai.system", "value": {"stringValue": "consul-ai-gw"}},
                                {"key": "gen_ai.request.model", "value": {"stringValue": str(data.get("model", "meta-llama/llama-3-70b-instruct"))}},
                                {"key": "consul.mesh.version", "value": {"stringValue": "2.1.0-enterprise"}},
                            ]
                        },
                        "scopeSpans": [
                            {
                                "scope": {"name": "camp.telemetry"},
                                "spans": [
                                    {
                                        "traceId": raw_tid,
                                        "spanId": parent_span_id,
                                        "name": "POST /api/travel/plan (API Gateway)",
                                        "kind": 2,
                                        "startTimeUnixNano": str(now_ns - 800000000),
                                        "endTimeUnixNano": str(now_ns),
                                        "attributes": [
                                            {"key": "http.method", "value": {"stringValue": "POST"}},
                                            {"key": "http.route", "value": {"stringValue": "/api/travel/plan"}},
                                            {"key": "user.obo", "value": {"stringValue": str(data.get("user_obo", "traveler-101"))}},
                                            {"key": "destination", "value": {"stringValue": str(data.get("destination", "San Francisco"))}},
                                        ],
                                        "status": {"code": 1},
                                    },
                                    {
                                        "traceId": raw_tid,
                                        "spanId": agent_span_id,
                                        "parentSpanId": parent_span_id,
                                        "name": "travel-orchestrator.synthesize",
                                        "kind": 1,
                                        "startTimeUnixNano": str(now_ns - 600000000),
                                        "endTimeUnixNano": str(now_ns - 50000000),
                                        "attributes": [
                                            {"key": "service.name", "value": {"stringValue": "travel-orchestrator"}},
                                            {"key": "sub_agents", "value": {"stringValue": "booking-agent,weather-agent"}},
                                            {"key": "mcp_tools", "value": {"stringValue": "hotel-mcp,flight-mcp,external-mcp"}},
                                        ],
                                        "status": {"code": 1},
                                    },
                                    {
                                        "traceId": raw_tid,
                                        "spanId": llm_span_id,
                                        "parentSpanId": agent_span_id,
                                        "name": "travel-igw.chat.completions",
                                        "kind": 3,
                                        "startTimeUnixNano": str(now_ns - 400000000),
                                        "endTimeUnixNano": str(now_ns - 100000000),
                                        "attributes": [
                                            {"key": "gen_ai.system", "value": {"stringValue": "consul-ai-gw"}},
                                            {"key": "gen_ai.request.model", "value": {"stringValue": str(data.get("model", "meta-llama/llama-3-70b-instruct"))}},
                                            {"key": "gen_ai.usage.prompt_tokens", "value": {"intValue": p_tok}},
                                            {"key": "gen_ai.usage.completion_tokens", "value": {"intValue": c_tok}},
                                            {"key": "gen_ai.usage.total_tokens", "value": {"intValue": tot_tok}},
                                            {"key": "gen_ai.usage.cost_usd", "value": {"doubleValue": round(tot_tok * 0.000005, 5)}},
                                            {"key": "vault.auth_broker", "value": {"stringValue": "token-injected"}},
                                        ],
                                        "status": {"code": 1},
                                    },
                                ],
                            }
                        ],
                    }
                ]
            }
            async with httpx.AsyncClient(timeout=2.0) as client:
                await client.post("http://tempo:4318/v1/traces", json=otlp_spans)
        except Exception:
            pass

        return {"status": "accepted", "trace_id": record["trace_id"], "attributes": record["otel_gen_ai_attributes"]}

    @app.get("/v1/traces")
    async def get_traces():
        return {"traces": list(reversed(traces_store[-50:]))}

    @app.get("/healthz")
    async def health():
        return {"status": "healthy", "service": "otel-collector"}

