                    "jsonrpc": "2.0",
                    "id": rpc_id,
                    "error": {
                        "code": -32001,
                        "message": detail,
                        "data": {
                            "enforced_by": "csl-mcp-sc (Consul MCP Sidecar ext-proc)",
