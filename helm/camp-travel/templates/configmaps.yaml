                await client.post(
                    f"{OTEL_COLLECTOR_URL}/v1/traces",
                    json={
                        "trace_id": trace_id,
                        "span_type": "llm_inference",
                        "span_name": "csl-inf-rt.chat.completions",
                        "instrumented_by": "csl-inf-rt (AI Inference Gateway Zero-Code ext-proc)",
                        "service": "travel-igw",
                        "agent_spiffe_id": caller_spiffe,
                        "user_obo": obo_user,
