apiVersion: v1
kind: ConfigMap
metadata:
  name: camp-gateway-configs
data:
  travel_igw.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
      - name: travel_igw_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 10001
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: travel_igw
              codec_type: AUTO
              route_config:
                name: travel_llm_routes
                virtual_hosts:
                - name: llm_vhost
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/v1/chat/completions"
                    route:
                      cluster: llm_backend_cluster
                      timeout: 15s
                    request_headers_to_add:
                      - header:
                          key: "Authorization"
                          value: "Bearer vault:secret/data/ai/llm#api_key_sk_99201"
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      - header:
                          key: "x-consul-mesh-tier"
                          value: "travel-igw-2.1"
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - match:
                      prefix: "/v1/messages"
                    route:
                      cluster: llm_backend_cluster
                      timeout: 15s
                    request_headers_to_add:
                      - header:
                          key: "Authorization"
                          value: "Bearer vault:secret/data/ai/anthropic#api_key_ant_8820"
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
              http_filters:
              - name: envoy.filters.http.local_ratelimit
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                  stat_prefix: travel_igw_token_limiter
                  token_bucket:
                    max_tokens: 100
                    tokens_per_fill: 100
                    fill_interval: 1s
                  filter_enabled:
                    default_value:
                      numerator: 100
                      denominator: HUNDRED
                  filter_enforced:
                    default_value:
                      numerator: 100
                      denominator: HUNDRED
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: llm_backend_cluster
        connect_timeout: 1s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: llm_backend_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.llmBackend.name }}
                    port_value: {{ .Values.llmBackend.port }}

  terminating_gw.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9902
    static_resources:
      listeners:
      - name: terminating_gw_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 10002
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: terminating_gw
              codec_type: AUTO
              route_config:
                name: terminating_routes
                virtual_hosts:
                - name: egress_vhost
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/external/mcp"
                    route:
                      cluster: external_mcp_cluster
                      timeout: 10s
                    request_headers_to_add:
                      - header:
                          key: "Authorization"
                          value: "Bearer vault:secret/data/partners/amadeus#gds_token_9918"
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      - header:
                          key: "x-egress-gateway"
                          value: "consul-terminating-gw-2.1"
                        append_action: OVERWRITE_IF_EXISTS_OR_ADD
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: external_mcp_cluster
        connect_timeout: 1s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: external_mcp_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.externalMcp.name }}
                    port_value: {{ .Values.externalMcp.port }}

  api_gw.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9900
    static_resources:
      listeners:
      - name: api_gw_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: api_gw
              codec_type: AUTO
              route_config:
                name: api_gw_routes
                virtual_hosts:
                - name: ingress_vhost
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/agent/orchestrate"
                    route:
                      cluster: orchestrator_cluster
                      timeout: 20s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: orchestrator_cluster
        connect_timeout: 1s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: orchestrator_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.orchestrator.name }}
                    port_value: {{ .Values.orchestrator.port }}
