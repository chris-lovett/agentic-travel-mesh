                "total_tokens": total_tokens,
            },
            "gateway_metadata": {
                "authenticated_by_vault": True,
                "vault_secret_ref": vault_secret_ref,
                "gateway_tier": request.headers.get("x-consul-mesh-tier", "travel-igw-2.1 (csl-inf-rt)"),
                "tenant_obo_user": obo_user,
