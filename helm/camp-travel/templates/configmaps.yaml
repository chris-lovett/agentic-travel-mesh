    async def emit_mcp_sidecar_span(
        trace_id: str,
        caller_spiffe: str,
        obo_user: str,
        tool_name: str,
        arguments: Dict[str, Any],
        result: Dict[str, Any],
        span_type: str = "mcp_tool_call",
