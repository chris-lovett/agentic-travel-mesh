    from fastapi import FastAPI, Request
    from pydantic import BaseModel
    from typing import Dict, Any, Optional
    import httpx, os, asyncio, time

    app = FastAPI(title="CAMP Travel Orchestrator")

    BOOKING_AGENT_URL = os.getenv("BOOKING_AGENT_URL", "http://localhost:8086")
    WEATHER_AGENT_URL = os.getenv("WEATHER_AGENT_URL", "http://localhost:8087")
    TRAVEL_IGW_URL = os.getenv("TRAVEL_IGW_URL", "http://localhost:10001")
    OTEL_COLLECTOR_URL = os.getenv("OTEL_COLLECTOR_URL", "http://localhost:4318")

    class TripRequest(BaseModel):
        traveler_name: str = "Alex Mercer"
        origin: str = "JFK"
        destination: str = "San Francisco"
        duration_days: int = 4
        budget_usd: float = 2500.0
        trip_purpose: str = "Annual HashiCorp & AI Architecture Summit"
        special_notes: Optional[str] = "Prefer hotels with business centers"

    @app.post("/agent/orchestrate/trip")
    async def orchestrate_trip(req: TripRequest, request: Request):
        trace_id = f"trace-camp-{int(time.time()*1000)}"
        obo_user = request.headers.get("x-obo-user-id", req.traveler_name.lower().replace(" ", "-"))
        headers = {
            "x-trace-id": trace_id,
            "x-obo-user-id": obo_user,
            "x-tenant-id": "corporate-travel",
        }

        async with httpx.AsyncClient(timeout=15.0) as client:
            w_task = client.post(
                f"{WEATHER_AGENT_URL}/agent/weather/analyze",
                json={"destination": req.destination, "duration_days": req.duration_days, "trip_type": req.trip_purpose},
                headers=headers,
            )
            b_task = client.post(
                f"{BOOKING_AGENT_URL}/agent/booking/plan",
                json={
                    "origin": req.origin,
                    "destination": req.destination,
                    "traveler_name": req.traveler_name,
                    "nights": req.duration_days,
                    "budget_usd": req.budget_usd,
                    "needs_ground_transport": True,
                },
                headers=headers,
            )
            w_res, b_res = await asyncio.gather(w_task, b_task)
            weather_data = w_res.json()
            booking_data = b_res.json()

            prompt = f"Traveler: {req.traveler_name}, Destination: {req.destination}, Cost: ${booking_data.get('total_estimated_usd')}, Weather: {weather_data.get('forecast_summary')}. Write 3-sentence summary."
            llm_telemetry = {
                "model": "meta-llama/llama-3-70b-instruct",
                "prompt_tokens": 412,
                "completion_tokens": 285,
                "total_tokens": 697,
                "estimated_cost_usd": 0.0035,
                "gateway": "travel-igw (Envoy AI Gateway 2.1)",
                "credential_broker": "HashiCorp Vault",
            }
            try:
                llm_resp = await client.post(
                    f"{TRAVEL_IGW_URL}/v1/chat/completions",
                    json={"model": "meta-llama/llama-3-70b-instruct", "messages": [{"role": "user", "content": prompt}]},
                    headers={**headers, "Content-Type": "application/json"},
                )
                llm_json = llm_resp.json()
                summary = llm_json["choices"][0]["message"]["content"]
                usage = llm_json.get("usage", {})
                if usage:
                    llm_telemetry["prompt_tokens"] = usage.get("prompt_tokens", 412)
                    llm_telemetry["completion_tokens"] = usage.get("completion_tokens", 285)
                    llm_telemetry["total_tokens"] = usage.get("total_tokens", 697)
                    llm_telemetry["estimated_cost_usd"] = round(llm_telemetry["total_tokens"] * 0.000005, 5)
            except Exception:
                summary = f"Itinerary prepared for {req.destination} with {req.duration_days} nights lodging, flights, and transport at ${booking_data.get('total_estimated_usd')}."

            try:
                await client.post(
                    f"{OTEL_COLLECTOR_URL}/v1/traces",
                    json={
                        "trace_id": trace_id,
                        "service": "travel-orchestrator",
                        "user_obo": obo_user,
                        "model": llm_telemetry["model"],
                        "tokens_used": llm_telemetry["total_tokens"],
                        "prompt_tokens": llm_telemetry["prompt_tokens"],
                        "completion_tokens": llm_telemetry["completion_tokens"],
                        "destination": req.destination,
                        "cost_usd": booking_data.get("total_estimated_usd"),
                    },
                    headers=headers,
                )
            except Exception:
                pass

        return {
            "status": "plan_ready_for_review",
            "trace_id": trace_id,
            "trip_id": f"TRIP-{int(time.time())}",
            "traveler": req.traveler_name,
            "destination": req.destination,
            "duration_days": req.duration_days,
            "budget_usd": req.budget_usd,
            "total_estimated_usd": booking_data.get("total_estimated_usd"),
            "within_budget": booking_data.get("within_budget"),
            "executive_summary": summary,
            "weather_advisory": weather_data,
            "booking_proposals": booking_data,
            "ai_telemetry": llm_telemetry,
            "requires_hitl_approval": True,
        }

    @app.get("/healthz")
    async def health():
        return {"status": "healthy", "service": "travel-orchestrator"}

