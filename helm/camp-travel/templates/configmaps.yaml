                        "protocol_translation": protocol_translation,
                        "tokens_used": total_tokens,
                        "prompt_tokens": prompt_tokens,
                        "completion_tokens": completion_tokens,
                    },
                )
        except Exception:
            pass

        return {
            "id": f"chatcmpl-{int(time.time()*1000)}",
            "object": "chat.completion",
            "model": routed_model,
            "choices": [
                {
                    "index": 0,
