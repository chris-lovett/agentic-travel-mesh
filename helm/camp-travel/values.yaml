global:
  datacenter: dc1
  domain: consul

# Consul 2.1 Agentic Runtime Fabric (Enterprise) Configuration
# Prerequisite: enable the gate on the Consul 2.1 server (requires an ACL token with operator:write).
# See README "Option C", Step 1: consul operator feature set -token="$CONSUL_TOKEN" consul-ai enabled
ai:
  # Chart-internal flag only. Do NOT set ai.enabled=true on the Consul Helm release for this demo (see README).
  enabled: true
  featureGate: "consul-ai"
  registry: "icr.io/hashicorp-enterprise"
  version: "2.1.0"
  # Official Consul 2.1 Agentic Runtime Fabric component images
  agent:
    image: "icr.io/hashicorp-enterprise/csl-mcp-sc:2.1.0"
  inferenceGateway:
    image: "icr.io/hashicorp-enterprise/csl-inf-rt:2.1.0"
    processorImage: "icr.io/hashicorp-enterprise/csl-ig-pro:2.1.0"
  analytics:
    image: "icr.io/hashicorp-enterprise/csl-ag-ana:2.1.0"
    spanRelayImage: "icr.io/hashicorp-enterprise/csl-nod-rly:2.1.0"
    bullmqQueueName: "consul-ai-cycle-detection"

# Mesh-wide TLS (applies to the whole Consul partition, not just this release).
# Offers hybrid post-quantum key exchange (X25519MLKEM768, classical X25519 fallback) on mesh mTLS.
# Needs Consul 2.1+ and a Mesh CRD that exposes ecdhCurves. Key exchange only: certificates stay classical.
meshTLS:
  hybridPostQuantum: true

# Container image defaults
images:
  python: "docker.io/library/python:3.11-slim"
  envoy: "docker.io/envoyproxy/envoy:v1.31.0"

# OpenShift route / Ingress exposure
ingress:
  enabled: true
  openShiftRoute: true

# 1. Experience UI & Review Backend
experienceUI:
  name: experience-ui
  port: 3000
  replicaCount: 1
  resources:
    limits: { cpu: "500m", memory: "512Mi" }
    requests: { cpu: "30m", memory: "64Mi" }

# 2. Ingress API Gateway (Envoy)
apiGw:
  name: api-gw
  port: 10000
  adminPort: 9900
  replicaCount: 1
  resources:
    limits: { cpu: "250m", memory: "256Mi" }
    requests: { cpu: "30m", memory: "64Mi" }

# 3. Travel Orchestrator Agent (ai-agent)
orchestrator:
  name: travel-orchestrator
  aiRole: "ai-agent"
  port: 8080
  replicaCount: 1
  resources:
    limits: { cpu: "250m", memory: "256Mi" }
    requests: { cpu: "30m", memory: "64Mi" }

# 4. Booking Sub-Agent (ai-agent)
bookingAgent:
  name: booking-agent
  aiRole: "ai-agent"
  port: 8086
  replicaCount: 1
  resources:
    limits: { cpu: "250m", memory: "256Mi" }
    requests: { cpu: "30m", memory: "64Mi" }

# 5. Weather Sub-Agent (ai-agent)
weatherAgent:
  name: weather-agent
